<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANA MAX OS-27 | Enterprise God View</title>
    <style>
        :root {
            --bg-base: #020617;
            --bg-panel: rgba(15, 23, 42, 0.85);
            --border-color: rgba(30, 41, 59, 0.8);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --neon-blue: #0ea5e9;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --neon-yellow: #f59e0b;
            --neon-purple: #8b5cf6;
            --neon-cyan: #06b6d4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
        }

        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(2, 6, 23, 0.95), rgba(15, 23, 42, 0.9));
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f1f5f9, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h1 span {
            color: var(--neon-blue);
            text-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            -webkit-text-fill-color: var(--neon-blue);
        }

        .system-stats {
            display: flex;
            gap: 24px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 80px;
        }

        .stat-label { color: var(--text-muted); text-transform: uppercase; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.05em; }
        .stat-value { color: var(--neon-cyan); font-weight: 700; font-size: 0.9rem; }

        .grid {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: 1fr 1fr;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.8));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6), 0 10px 15px -6px rgba(14, 165, 233, 0.2);
            transform: translateY(-2px);
        }

        .panel-header {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
        }

        .panel-content {
            padding: 1rem;
            flex: 1;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-entry {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            word-break: break-all;
            transition: background 0.2s ease;
            border-radius: 4px;
        }

        .log-entry:hover {
            background: rgba(255,255,255,0.02);
        }

        .time { color: var(--text-muted); font-size: 0.7rem; margin-right: 8px; font-weight: 500; }
        .tag { font-weight: bold; margin-right: 6px; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; }
        
        .tag-frida { color: var(--neon-purple); background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); }
        .tag-ollama { color: var(--neon-blue); background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.3); }
        .tag-reflex { color: var(--neon-red); background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }
        .tag-memory { color: var(--neon-green); background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
        .tag-sys { color: var(--neon-cyan); background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); }
        
        /* Log level colors - Developer friendly */
        .tag-error { color: #ef4444; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); font-weight: 700; }
        .tag-warning { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
        .tag-info { color: #3b82f6; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); }
        .tag-debug { color: #8b5cf6; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); }
        .tag-success { color: #10b981; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
        
        /* Highlight errors in log content */
        .log-entry.error-highlight {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
        }
        
        .log-entry.warning-highlight {
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid #f59e0b;
        }

        #vision-panel { grid-row: span 2; }
        #vision-container {
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
        }
        
        #vision-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .progress-bar {
            height: 6px;
            width: 100%;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            color: var(--neon-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

    </style>
</head>
<body>

<header>
    <div class="brand">
        <h1>ANA MAX <span>ENTERPRISE</span></h1>
        <div class="status-badge">OS-27 ACTIVE</div>
    </div>
    <div class="system-stats">
        <div class="stat-item">
            <span class="stat-label">CPU Usage</span>
            <span class="stat-value" id="cpu-val">0%</span>
            <div class="progress-bar"><div id="cpu-bar" class="progress-fill" style="width: 0%"></div></div>
        </div>
        <div class="stat-item">
            <span class="stat-label">RAM Usage</span>
            <span class="stat-value" id="ram-val">0%</span>
            <div class="progress-bar"><div id="ram-bar" class="progress-fill" style="width: 0%"></div></div>
        </div>
        <div class="stat-item">
            <span class="stat-label">Memories</span>
            <span class="stat-value" id="mem-count">0</span>
        </div>
    </div>
</header>

<div class="grid">
    <!-- Panel: System Telemetry -->
    <div class="panel">
        <div class="panel-header" style="color: var(--neon-cyan);">
            System Canalizare (Bus)
        </div>
        <div class="panel-content" id="sys-log"></div>
    </div>

    <!-- Panel: Vision (Central) -->
    <div class="panel" id="vision-panel">
        <div class="panel-header" style="color: var(--neon-yellow);">
            God View (Vision PC)
        </div>
        <div class="panel-content" style="padding: 0;">
            <div id="vision-container">
                <img id="vision-img" src="" alt="Live Stream">
            </div>
        </div>
    </div>

    <!-- Panel: Reflex Alerts -->
    <div class="panel">
        <div class="panel-header" style="color: var(--neon-red);">
            Reflex Remediation
        </div>
        <div class="panel-content" id="reflex-log"></div>
    </div>

    <!-- Panel: Memory Cortex -->
    <div class="panel">
        <div class="panel-header" style="color: var(--neon-green);">
            Memory Cortex (Persistent)
        </div>
        <div class="panel-content" id="memory-log"></div>
    </div>

    <!-- Panel: LLM Stream -->
    <div class="panel">
        <div class="panel-header" style="color: var(--neon-blue);">
            Inference Engine (Qwen)
        </div>
        <div class="panel-content" id="ollama-log"></div>
    </div>
</div>

<script>
    const evtSource = new EventSource("/dashboard/stream");
    
    const logs = {
        sys: document.getElementById("sys-log"),
        reflex: document.getElementById("reflex-log"),
        memory: document.getElementById("memory-log"),
        ollama: document.getElementById("ollama-log")
    };

    const stats = {
        cpu: document.getElementById("cpu-val"),
        cpuBar: document.getElementById("cpu-bar"),
        ram: document.getElementById("ram-val"),
        ramBar: document.getElementById("ram-bar"),
        mem: document.getElementById("mem-count")
    };

    const visionImg = document.getElementById("vision-img");
    let memoryCount = 0;

    function addLog(container, type, text) {
        const div = document.createElement("div");
        div.className = "log-entry";
        
        // Detect error/warning keywords for highlighting
        const textLower = text.toLowerCase();
        if (textLower.includes('error') || textLower.includes('failed') || textLower.includes('exception')) {
            div.classList.add('error-highlight');
        } else if (textLower.includes('warning') || textLower.includes('warn')) {
            div.classList.add('warning-highlight');
        }
        
        const ts = new Date().toLocaleTimeString();
        div.innerHTML = `<span class="time">[${ts}]</span><span class="tag tag-${type}">${type.toUpperCase()}</span> <span>${text}</span>`;
        container.appendChild(div);
        if (container.children.length > 50) container.removeChild(container.firstChild);
        container.scrollTop = container.scrollHeight;
    }

    function firstFiniteNumber(...values) {
        for (const value of values) {
            const number = Number(value);
            if (Number.isFinite(number)) return number;
        }
        return 0;
    }

    function setPercent(valueNode, barNode, value) {
        const percent = Math.max(0, Math.min(100, value));
        const label = `${percent.toFixed(1)}%`;
        valueNode.innerText = label;
        barNode.style.width = label;
    }

    evtSource.onmessage = function(event) {
        try {
            const ev = JSON.parse(event.data);
            if (ev.type === "heartbeat") return;

            // Handle System Telemetry
            if (ev.source === "dashboard_feeder") {
                if (ev.type === "telemetry.system") {
                    const d = ev.data || {};
                    const cpuPercent = firstFiniteNumber(d.cpu_percent, d.cpu, d.cpu?.percent);
                    const memoryPercent = firstFiniteNumber(d.memory_percent, d.memory, d.memory?.percent);
                    setPercent(stats.cpu, stats.cpuBar, cpuPercent);
                    setPercent(stats.ram, stats.ramBar, memoryPercent);
                }
                if (ev.type === "telemetry.procmon_audit") {
                    addLog(logs.reflex, "reflex", ev.data.last_event || JSON.stringify(ev.data));
                } else {
                    addLog(logs.sys, "sys", JSON.stringify(ev.data));
                }
            }
            // Handle Memory
            else if (ev.source === "memory_cortex") {
                if (ev.type === "memory_sync" && ev.data && typeof ev.data.total_count === "number") {
                    memoryCount = ev.data.total_count;
                } else {
                    memoryCount++;
                }
                stats.mem.innerText = memoryCount;
                addLog(logs.memory, "memory", `${ev.type}: ${JSON.stringify(ev.data)}`);
            }
            // Handle Reflex
            else if (ev.source === "ReflexDispatcher" || ev.type === "REFLEX_ALERT") {
                addLog(logs.reflex, "reflex", ev.data.message || JSON.stringify(ev.data));
            }
            // Handle LLM
            else if (ev.source === "OllamaLive" || ev.type === "LLM_LOG") {
                addLog(logs.ollama, "ollama", typeof ev.data === 'string' ? ev.data : JSON.stringify(ev.data));
            }
            // Handle Vision
            else if (ev.source === "VisionPC" || ev.type === "VISION_CAPTURE") {
                if (ev.data.file) {
                    visionImg.src = "/local_image?path=" + encodeURIComponent(ev.data.file) + "&t=" + Date.now();
                }
            }
        } catch(e) {}
    };
</script>

</body>
</html>
