<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE Agent Test</title>
    <style>
        body {
            background-color: #020208;
            color: #59f2ff;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(89, 242, 255, 0.3);
            border-radius: 20px;
            background: rgba(10, 12, 24, 0.8);
            box-shadow: 0 0 30px rgba(89, 242, 255, 0.2);
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(89, 242, 255, 0.1); }
            100% { box-shadow: 0 0 50px rgba(139, 92, 246, 0.4); }
        }
        h1 {
            background: linear-gradient(90deg, #59f2ff, #8b5cf6, #ff4fd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            margin-bottom: 10px;
        }
        p {
            color: #a7adc9;
            font-size: 1.2em;
            max-width: 500px;
            line-height: 1.6;
        }
        .terminal {
            margin-top: 30px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            color: #34d399;
            text-align: left;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Local IDE!</h1>
        <p>Acest site a fost creat <b>automat</b> fix pe Desktop-ul tau de catre AI-ul din IDE (eu).</p>
        <p>Asta demonstreaza ce inseamna cand imi dai acces la sistem: pot scrie, citi si rula lucruri direct la tine in Windows.</p>
        <div class="terminal">
            > whoami<br>
            > C:\Users\billy<br>
            > Status: ACCES COMPLET CONFIRMAT.
        </div>
    </div>
</body>
</html>
