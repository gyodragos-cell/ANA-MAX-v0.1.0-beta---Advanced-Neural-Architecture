[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os29-lab"
version = "0.1.0"
description = "ANA MAX OS29: evidence-first operational intelligence, scoped diagnostics and traceable local memory."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
os29 = "os29.cli:main"
os29-gateway = "os29.gateway:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["os29*"]