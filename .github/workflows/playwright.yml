name: Portfolio Playwright E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python static server
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run portfolio browser tests
        run: npm run test:e2e
      - name: Upload test report, screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-portfolio-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
