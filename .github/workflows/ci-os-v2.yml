name: CI — ANA MAX OS v2

on:
  push:
    branches:
      - main
      - 'docs/*'
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit & integration tests (OS v2)
        working-directory: .
        run: |
          echo "Running OS v2 tests..."
          if [ -d ana/tests ]; then
            python -m pytest ana/tests -q
          elif [ -f tests/test_smoke.py ]; then
            python -m pytest tests/test_smoke.py -q
          else
            echo "No OS v2 test directory found, skipping unit/integration tests."
          fi

      - name: Run smoke test (OS v2)
        working-directory: .
        run: |
          echo "Running smoke test..."
          if [ -f ana/smoke_test.py ]; then
            python ana/smoke_test.py
          elif [ -f tests/test_smoke.py ]; then
            python -m pytest tests/test_smoke.py -q
          else
            echo "No smoke test found, skipping."
          fi

  docs-lint:
    runs-on: ubuntu-latest
    needs: test-and-smoke
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate docs presence
        run: |
          if [ ! -f README.md ]; then echo "Root README.md missing" && exit 1; fi
          if [ ! -d ana ]; then echo "ana/ directory missing" && exit 1; fi
