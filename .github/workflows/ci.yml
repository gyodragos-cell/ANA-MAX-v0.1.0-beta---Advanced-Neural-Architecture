name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        
    - name: Pre-compile Python source files
      run: python -m compileall -q main.py core tools vscode_extension
      
    - name: Quick test (3 PASS / 0 FAIL)
      run: python main.py --test
      
    - name: Verify tool count (64 loaded tools)
      run: python main.py --list-tools
      
    - name: Run unit tests
      run: python -m unittest discover -s tests -v
